name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 需要完整 tag 历史：构建版本号由 scripts/resolve-app-version.mjs 从 git tag 推导
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install test prerequisites
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y ripgrep && break
            echo "apt retry ${i}/3"; sleep 20
          done

      - name: Checkout backend OpenAPI baseline
        run: |
          rm -rf ../sism-backend
          git clone --depth 1 https://github.com/CDUESTC-OpenAtom-Open-Source-Club/sism-backend.git ../sism-backend

      - name: Verify architecture baseline
        run: npm run arch:check

      - name: Run type check
        # 2026-11-15：旧命令 `vue-tsc --noEmit` 命中的是 solution-style 根 tsconfig，
        # 对全仓零覆盖（写入类型错误仍 exit 0），类型检查形同虚设。
        # 现在改为真正跑 `vue-tsc -b --force` 并与存量错误基线比对：
        # 只要没有新增类型错误即通过，存量错误数会作为可见指标输出。
        # 基线：scripts/typecheck-baseline.json（npm run type-check:baseline 可刷新）。
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_USE_MOCK: false
          VITE_ENABLE_DEVTOOLS: false
          VITE_LOG_LEVEL: warn

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/**
          retention-days: 14
