name: Build and Push Frontend Image

# 拓扑定死：GitHub 只负责构建 + 产出 artifact + 推 GHCR。
# 禁止在本仓库任何 workflow 里下载产物到服务器、或触发部署。
# 落服一律走本地：download-offline-release.sh → upload-offline-release.sh → install-offline-release.sh
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  qa:
    name: QA
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Checkout backend OpenAPI baseline
        run: |
          rm -rf ../sism-backend
          git clone --depth 1 https://github.com/CDUESTC-OpenAtom-Open-Source-Club/sism-backend.git ../sism-backend

      - name: Verify architecture baseline
        run: npm run arch:check

      - name: Run type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_USE_MOCK: false
          VITE_ENABLE_DEVTOOLS: false
          VITE_LOG_LEVEL: warn

  build-and-push:
    name: Build and Push
    needs: qa
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/strategic-task-management" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read app version
        id: appver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build image on GitHub runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:main
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_USE_MOCK=false
            VITE_ENABLE_DEVTOOLS=false
            VITE_LOG_LEVEL=warn
            VITE_APP_COMMIT_HASH=${{ github.sha }}
            VITE_APP_VERSION=${{ steps.appver.outputs.version }}
            # 2026-10-20：生产密钥从仓库 Secrets 注入（.env.production 已不入库）
            VITE_API_SECRET=${{ secrets.VITE_API_SECRET }}
            VITE_STORAGE_KEY=${{ secrets.VITE_STORAGE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image and create deployment artifact
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          for tag in "${GITHUB_SHA}" main; do
            for attempt in 1 2 3; do
              if docker push "${IMAGE}:${tag}"; then
                break
              fi
              if [[ "${attempt}" == "3" ]]; then
                exit 1
              fi
              sleep $((attempt * 5))
            done
          done
          docker save "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:main" | gzip -1 > frontend-image.tar.gz

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-${{ github.sha }}
          path: |
            frontend-image.tar.gz
            scripts/deployment/validate-runner-host.sh
          retention-days: 7
          compression-level: 0
          overwrite: true
