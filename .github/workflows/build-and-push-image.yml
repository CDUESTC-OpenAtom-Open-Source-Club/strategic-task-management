name: Build and Push Frontend Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  qa:
    name: QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Checkout backend OpenAPI baseline
        run: |
          rm -rf ../sism-backend
          git clone --depth 1 https://github.com/CDUESTC-OpenAtom-Open-Source-Club/sism-backend.git ../sism-backend

      - name: Verify architecture baseline
        run: npm run arch:check

      - name: Run type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_USE_MOCK: false
          VITE_ENABLE_DEVTOOLS: false
          VITE_LOG_LEVEL: warn

  build-and-push:
    name: Build and Push
    needs: qa
    runs-on: [self-hosted, Linux, X64, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/strategic-task-management" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | sudo docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          sudo docker build \
            --file Dockerfile \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            --build-arg VITE_USE_MOCK=false \
            --build-arg VITE_ENABLE_DEVTOOLS=false \
            --build-arg VITE_LOG_LEVEL=warn \
            --build-arg VITE_APP_COMMIT_HASH="${GITHUB_SHA}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:main" \
            .
          for tag in "${GITHUB_SHA}" main; do
            for attempt in 1 2 3; do
              if sudo docker push "${IMAGE}:${tag}"; then
                break
              fi
              if [[ "${attempt}" == "3" ]]; then
                exit 1
              fi
              sleep $((attempt * 5))
            done
          done

      - name: Trigger backend system deployment
        if: github.ref_name == 'main'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          : "${GHCR_TOKEN:?Missing GHCR_TOKEN secret}"
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GHCR_TOKEN}" \
            https://api.github.com/repos/CDUESTC-OpenAtom-Open-Source-Club/sism-backend/actions/workflows/build-and-push-image.yml/dispatches \
            -d @- <<EOF
          {
            "ref": "main",
            "inputs": {
              "deploy_mode": "frontend-only",
              "frontend_tag": "${GITHUB_SHA}",
              "target_env": "production"
            }
          }
          EOF
