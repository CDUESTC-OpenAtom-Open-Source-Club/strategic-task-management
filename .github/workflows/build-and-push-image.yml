name: Build and Push Frontend Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  qa:
    name: QA
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Checkout backend OpenAPI baseline
        run: |
          rm -rf ../sism-backend
          git clone --depth 1 https://github.com/CDUESTC-OpenAtom-Open-Source-Club/sism-backend.git ../sism-backend

      - name: Verify architecture baseline
        run: npm run arch:check

      - name: Run type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_USE_MOCK: false
          VITE_ENABLE_DEVTOOLS: false
          VITE_LOG_LEVEL: warn

  build-and-push:
    name: Build and Push
    needs: qa
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/strategic-task-management" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image on GitHub runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:main
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_USE_MOCK=false
            VITE_ENABLE_DEVTOOLS=false
            VITE_LOG_LEVEL=warn
            VITE_APP_COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image and create deployment artifact
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          for tag in "${GITHUB_SHA}" main; do
            for attempt in 1 2 3; do
              if docker push "${IMAGE}:${tag}"; then
                break
              fi
              if [[ "${attempt}" == "3" ]]; then
                exit 1
              fi
              sleep $((attempt * 5))
            done
          done
          docker save "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:main" | gzip -1 > frontend-image.tar.gz

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-${{ github.sha }}
          path: |
            frontend-image.tar.gz
            scripts/deployment/validate-runner-host.sh
          retention-days: 1
          compression-level: 0
          overwrite: true

  stage-on-server:
    name: Stage Image on Server Runner
    if: github.ref_name == 'main'
    needs: build-and-push
    runs-on: [self-hosted, Linux, X64, frontend, production]

    steps:
      - name: Normalize image name
        id: image
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/strategic-task-management:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify self-hosted runner
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT}" == "self-hosted" ]]
          sudo -n true
          sudo docker info >/dev/null

      - name: Download frontend image artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-image-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-image-${{ github.run_id }}

      - name: Validate deployment host
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/frontend-image-${{ github.run_id }}
        run: |
          set -euo pipefail
          bash "${ARTIFACT_DIR}/scripts/deployment/validate-runner-host.sh" \
            /opt/sism-stack/production

      - name: Load frontend image on server runner
        env:
          FRONTEND_IMAGE: ${{ steps.image.outputs.image }}
          ARTIFACT_DIR: ${{ runner.temp }}/frontend-image-${{ github.run_id }}
        run: |
          set -euo pipefail
          gzip -t "${ARTIFACT_DIR}/frontend-image.tar.gz"
          gzip -dc "${ARTIFACT_DIR}/frontend-image.tar.gz" | sudo docker load
          sudo docker image inspect "${FRONTEND_IMAGE}" >/dev/null

      - name: Trigger backend system deployment
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          : "${GHCR_TOKEN:?Missing GHCR_TOKEN secret}"
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GHCR_TOKEN}" \
            https://api.github.com/repos/CDUESTC-OpenAtom-Open-Source-Club/sism-backend/actions/workflows/build-and-push-image.yml/dispatches \
            -d @- <<EOF
          {
            "ref": "main",
            "inputs": {
              "deploy_mode": "frontend-only",
              "frontend_tag": "${GITHUB_SHA}",
              "target_env": "production"
            }
          }
          EOF

      - name: Remove downloaded frontend artifact
        if: ${{ always() }}
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/frontend-image-${{ github.run_id }}
        run: rm -rf "${ARTIFACT_DIR}"
